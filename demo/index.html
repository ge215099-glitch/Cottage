<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cottage · 界面 Demo（模拟数据）</title>
<style>
/* ============================================================
   Cottage Demo —— 纯前端模拟，无后端
   设计依据：docs/ui-design-sidebar-chat.md / docs/ui-design-conversation.md
   ============================================================ */

:root{
  --bg-app:#ffffff;
  --bg-sidebar:#f9f9f9;
  --surface-hover:rgba(0,0,0,.045);
  --surface-active:rgba(0,0,0,.075);
  --surface-overlay:#ffffff;
  --border-subtle:rgba(0,0,0,.08);
  --text-primary:#0d0d0d;
  --text-secondary:#5d5d5d;
  --text-tertiary:#8f8f8f;
  --accent:#0d0d0d;
  --accent-soft:#0a84ff;
  --danger:#d93025;
  --warn:#c77700;
  --bubble-user:#f1f1f1;
  --danger-bg:rgba(217,48,37,.08);
  --shadow-menu:0 8px 24px rgba(0,0,0,.12);
  --radius-row:8px;
  --radius-menu:10px;
  --radius-card:12px;
}
html[data-theme="dark"]{
  --bg-app:#191919;
  --bg-sidebar:#171717;
  --surface-hover:rgba(255,255,255,.055);
  --surface-active:rgba(255,255,255,.09);
  --surface-overlay:#252525;
  --border-subtle:rgba(255,255,255,.10);
  --text-primary:#ececec;
  --text-secondary:#b4b4b4;
  --text-tertiary:#8f8f8f;
  --accent:#ffffff;
  --accent-soft:#4da3ff;
  --danger:#ff6b60;
  --warn:#e0a33a;
  --bubble-user:#2f2f2f;
  --danger-bg:rgba(255,107,96,.12);
  --shadow-menu:0 8px 24px rgba(0,0,0,.36);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font:14px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--text-primary);
  background:var(--bg-app);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-soft);outline-offset:-2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--surface-active);border-radius:6px;border:3px solid transparent;background-clip:content-box}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------------- 外壳 ---------------- */
#shell{display:flex;height:100%}

/* ---------------- 左侧栏 ---------------- */
#sidebar{
  width:260px;flex:0 0 auto;background:var(--bg-sidebar);
  display:flex;flex-direction:column;position:relative;
  border-right:1px solid var(--border-subtle);
  transition:width .18s ease;
}
#sidebar.collapsed{width:56px}

.sidebar-head{height:56px;display:flex;align-items:center;gap:8px;padding:0 12px;flex:0 0 auto;cursor:default}
.brand{font-weight:650;font-size:14px;letter-spacing:.2px;white-space:nowrap;overflow:hidden}
.brand b{font-weight:650}
.icon-btn{
  width:28px;height:28px;border-radius:7px;display:grid;place-items:center;
  color:var(--text-secondary);flex:0 0 auto;
}
.icon-btn:hover{background:var(--surface-hover);color:var(--text-primary)}
.icon-btn svg{width:16px;height:16px;display:block}
.spacer{flex:1}

.sidebar-actions{padding:0 10px 10px;display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
.new-chat{
  height:38px;border-radius:10px;background:var(--accent);color:var(--bg-app);
  display:flex;align-items:center;gap:9px;padding:0 12px;font-weight:550;
}
.new-chat:hover{opacity:.88}
html[data-theme="dark"] .new-chat{color:#141414}
.new-chat svg{width:16px;height:16px}
.search-row{
  height:34px;border-radius:9px;display:flex;align-items:center;gap:9px;padding:0 10px;
  background:var(--surface-hover);color:var(--text-secondary);
}
.search-row:focus-within{background:var(--surface-active);box-shadow:inset 0 0 0 1px var(--border-subtle)}
.search-row svg{width:15px;height:15px;flex:0 0 auto}
.search-row input{flex:1;min-width:0;background:none;border:0;outline:none}
.search-row input::placeholder{color:var(--text-tertiary)}
.kbd{
  font:11px/1 ui-monospace,Consolas,monospace;padding:3px 5px;border-radius:5px;
  background:var(--surface-active);color:var(--text-tertiary)
}

.nav{padding:0 8px 10px;display:flex;flex-direction:column;gap:1px;flex:0 0 auto;
  border-bottom:1px solid var(--border-subtle);margin-bottom:8px}
.nav-item{
  height:34px;border-radius:var(--radius-row);display:flex;align-items:center;gap:10px;
  padding:0 10px;color:var(--text-primary);position:relative;width:100%;text-align:left;
}
.nav-item:hover{background:var(--surface-hover)}
.nav-item.active{background:var(--surface-active)}
.nav-item.active::before{
  content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--accent-soft)
}
.nav-item svg{width:16px;height:16px;flex:0 0 auto;color:var(--text-secondary)}
.nav-item span{white-space:nowrap;overflow:hidden}

.list-head{height:30px;display:flex;align-items:center;padding:0 10px 0 16px;color:var(--text-tertiary);font-size:12px;flex:0 0 auto}
.list-head .icon-btn{opacity:0;transition:opacity .12s}
.list-head:hover .icon-btn{opacity:1}

#conv-list{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 8px 12px}
.group-title{
  height:28px;display:flex;align-items:center;gap:6px;padding:0 8px;
  font-size:12px;color:var(--text-tertiary);position:sticky;top:0;
  background:var(--bg-sidebar);z-index:2;user-select:none;
}
.group-title .caret{width:14px;height:14px;opacity:.7}
.conv-row{
  height:36px;border-radius:var(--radius-row);display:flex;align-items:center;gap:8px;
  padding:0 4px 0 8px;position:relative;cursor:pointer;user-select:none;
}
.conv-row:hover{background:var(--surface-hover)}
.conv-row.active{background:var(--surface-active)}
.conv-row.active::before{
  content:"";position:absolute;left:0;top:9px;bottom:9px;width:2px;border-radius:2px;background:var(--accent-soft)
}
.conv-title{flex:1;min-width:0;font-size:13px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stream-dot{width:8px;height:8px;border-radius:50%;background:var(--accent-soft);flex:0 0 auto;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}
.row-menu-btn{
  width:26px;height:26px;border-radius:6px;display:grid;place-items:center;flex:0 0 auto;
  opacity:0;color:var(--text-secondary);transition:opacity .12s ease;
}
.row-menu-btn svg{width:16px;height:16px}
.conv-row:hover .row-menu-btn,.conv-row:focus-within .row-menu-btn{opacity:1}
.row-menu-btn:hover{background:var(--surface-active);color:var(--text-primary)}
.rename-input{
  flex:1;min-width:0;height:26px;border-radius:6px;padding:0 6px;
  background:var(--bg-app);border:1px solid var(--accent-soft);outline:none;font-size:13px
}
.shake{animation:shake .12s ease 2}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}

.sidebar-foot{
  height:56px;flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:0 12px;
  border-top:1px solid var(--border-subtle);cursor:pointer
}
.sidebar-foot:hover{background:var(--surface-hover)}
.sidebar-foot .who{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-foot .who small{display:block;color:var(--text-tertiary);font-size:11px;line-height:14px}

/* 折叠态 */
#sidebar.collapsed .brand,
#sidebar.collapsed .new-chat span,
#sidebar.collapsed .search-row input,
#sidebar.collapsed .search-row .kbd,
#sidebar.collapsed .nav-item span,
#sidebar.collapsed .list-head span,
#sidebar.collapsed .conv-title,
#sidebar.collapsed .sidebar-foot .who,
#sidebar.collapsed .row-menu-btn{display:none}
#sidebar.collapsed .sidebar-head{justify-content:center;padding:0}
#sidebar.collapsed .new-chat{justify-content:center;padding:0}
#sidebar.collapsed .search-row{justify-content:center;padding:0;background:none}
#sidebar.collapsed .nav-item{justify-content:center;padding:0}
#sidebar.collapsed .conv-row{justify-content:center;padding:0}
#sidebar.collapsed .sidebar-foot{justify-content:center;padding:0}
#sidebar.collapsed .list-head{padding:0 0 0 4px;font-size:0}
#sidebar.collapsed .group-title{font-size:0;justify-content:center}
#sidebar.collapsed .group-title .caret{display:none}
#sidebar.collapsed .group-title::after{content:"·";font-size:12px}

/* ---------------- 主区 ---------------- */
#main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.topbar{height:48px;flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:0 10px 0 14px}
.topbar .title{
  font-size:14px;font-weight:550;max-width:52%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  padding:5px 8px;border-radius:7px;cursor:text
}
.topbar .title:hover{background:var(--surface-hover)}
.topbar.pin-visible .pin-btn{opacity:1}
.pin-btn{opacity:0;transition:opacity .12s;color:var(--text-tertiary)}
.pin-btn.on{opacity:1;color:var(--accent-soft)}
.pin-btn.on svg{fill:currentColor}
.topbar .title-input{
  font-size:14px;font-weight:550;padding:4px 7px;border-radius:7px;border:1px solid var(--accent-soft);
  background:var(--bg-app);outline:none;min-width:180px;max-width:52%
}

#scroll{flex:1;min-height:0;overflow-y:auto;position:relative}
.thread{max-width:720px;margin:0 auto;padding:8px 24px 28px}

.msg{position:relative;margin-top:24px;scroll-margin-bottom:80px}
.msg.same-role{margin-top:8px}
.msg .head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.msg .head .name{font-size:12px;color:var(--text-secondary)}
.msg .body{font-size:15px;line-height:26px;white-space:pre-wrap;word-break:break-word}
.msg.user{display:flex;flex-direction:column;align-items:flex-end}
.msg.user .head{display:none}
.msg.user .body{
  background:var(--bubble-user);border-radius:var(--radius-card);padding:10px 14px;
  max-width:min(560px,86%);white-space:pre-wrap
}
/* 归档消息只做轻微降透明度区分，不加任何提示标签 */
.msg.archived .body{opacity:.62}
.toolbar{
  position:absolute;top:-14px;display:flex;gap:2px;padding:2px;border-radius:9px;
  background:var(--surface-overlay);border:1px solid var(--border-subtle);box-shadow:var(--shadow-menu);
  opacity:0;pointer-events:none;transition:opacity .12s ease;z-index:3
}
.msg.assistant .toolbar{right:0}
.msg.user .toolbar{left:0}
.msg:hover .toolbar,.msg.show-toolbar .toolbar{opacity:1;pointer-events:auto}
.toolbar button{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--text-secondary)}
.toolbar button:hover{background:var(--surface-hover);color:var(--text-primary)}
.toolbar svg{width:15px;height:15px}
.meta{font-size:12px;color:var(--text-tertiary);margin-top:6px;opacity:0;transition:opacity .12s}
.msg:hover .meta,.meta.pinned{opacity:1}
.msg.user .meta{text-align:right;max-width:86%}
.cursor{
  display:inline-block;width:2px;height:17px;background:var(--accent-soft);
  vertical-align:-3px;margin-left:2px;animation:blink 1s steps(1) infinite
}
@keyframes blink{50%{opacity:0}}
.edit-area{
  width:100%;min-height:64px;resize:vertical;border-radius:10px;padding:10px 12px;
  background:var(--bg-app);border:1px solid var(--accent-soft);outline:none;font-size:15px;line-height:24px
}
.edit-actions{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--text-secondary)}
.inline-error{color:var(--danger)}

.summary-divider{margin:26px 0 6px;display:flex;align-items:center;gap:10px;color:var(--text-tertiary)}
.summary-divider::before,.summary-divider::after{content:"";height:1px;background:var(--border-subtle);flex:1}
.summary-pill{
  font-size:12px;padding:4px 10px;border-radius:999px;background:var(--surface-hover);
  display:flex;align-items:center;gap:6px;white-space:nowrap
}
.summary-pill:hover{background:var(--surface-active)}
.summary-pill svg{width:13px;height:13px}
.summary-body{
  margin-top:10px;padding:12px 14px;border-radius:var(--radius-card);background:var(--surface-hover);
  font-size:13px;line-height:22px;color:var(--text-secondary)
}
.summary-body h4{margin:0 0 6px;font-size:12px;color:var(--text-tertiary);font-weight:600}
.summary-body ul{margin:0;padding-left:18px}
.summary-body .restore{margin-top:10px;font-size:12px;color:var(--accent-soft)}

.error-bar{
  margin-top:10px;padding:9px 12px;border-radius:10px;background:var(--danger-bg);
  color:var(--danger);font-size:13px;display:flex;align-items:center;gap:10px
}
.error-bar button{color:inherit;text-decoration:underline;font-size:13px}
.interrupted-tag{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-tertiary);margin-top:8px
}
.interrupted-tag button{color:var(--accent-soft)}

.empty{max-width:620px;margin:0 auto;padding:12vh 24px 0;text-align:center}
.empty h2{margin:0 0 10px;font-size:20px;font-weight:600}
.empty p{margin:0 auto;color:var(--text-secondary);font-size:14px;line-height:24px;max-width:480px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:22px}
.chip{
  padding:6px 12px;border-radius:999px;background:var(--surface-hover);font-size:13px;color:var(--text-secondary)
}
.chip:hover{background:var(--surface-active);color:var(--text-primary)}

#to-latest{
  position:absolute;right:22px;bottom:16px;width:34px;height:34px;border-radius:50%;
  background:var(--surface-overlay);border:1px solid var(--border-subtle);box-shadow:var(--shadow-menu);
  display:none;place-items:center
}
#to-latest.show{display:grid}

/* 输入区 */
.composer-wrap{flex:0 0 auto;padding:8px 24px 16px}
.composer{max-width:720px;margin:0 auto}
.composer-box{
  border:1px solid var(--border-subtle);border-radius:16px;background:var(--bg-app);
  box-shadow:0 2px 10px rgba(0,0,0,.04);padding:10px 12px 8px
}
html[data-theme="dark"] .composer-box{box-shadow:none;background:#212121}
.composer textarea{
  width:100%;border:0;outline:none;resize:none;background:none;font-size:15px;line-height:24px;
  max-height:200px;min-height:26px
}
.composer-foot{display:flex;align-items:center;gap:6px;margin-top:6px}
.mchip{
  height:28px;border-radius:8px;padding:0 9px;display:flex;align-items:center;gap:6px;
  font-size:12px;color:var(--text-secondary);white-space:nowrap
}
.mchip:hover{background:var(--surface-hover);color:var(--text-primary)}
.mchip svg{width:13px;height:13px}
.mchip.hidden{display:none}
.meter{
  margin-left:auto;height:28px;border-radius:8px;padding:0 9px;display:flex;align-items:center;gap:7px;
  font-size:12px;color:var(--text-secondary)
}
.meter:hover{background:var(--surface-hover)}
.meter .bar{width:44px;height:5px;border-radius:3px;background:var(--surface-active);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--accent-soft);border-radius:3px;transition:width .3s}
.meter.warn{color:var(--warn)}
.meter.warn .bar i{background:var(--warn)}
.meter.danger{color:var(--danger)}
.meter.danger .bar i{background:var(--danger)}
.send-btn{
  width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--bg-app);
  display:grid;place-items:center;flex:0 0 auto
}
html[data-theme="dark"] .send-btn{color:#141414}
.send-btn:disabled{opacity:.3;cursor:not-allowed}
.send-btn.stop{background:var(--text-primary)}
.send-btn svg{width:16px;height:16px}
.composer-hint{text-align:center;font-size:11px;color:var(--text-tertiary);margin-top:8px}
.composer-hint.warn{color:var(--danger)}

/* ---------------- 右栏（只拉出/收起，不可调宽） ---------------- */
#panel{
  width:320px;flex:0 0 auto;border-left:1px solid var(--border-subtle);display:flex;flex-direction:column;
  position:relative;background:var(--bg-app)
}
#panel.hidden{display:none}
#panel:not(.hidden){animation:panelIn .16s ease}
@keyframes panelIn{from{opacity:.4;transform:translateX(10px)}to{opacity:1;transform:none}}
.tabs{height:32px;flex:0 0 auto;display:flex;align-items:stretch;gap:2px;padding:0 10px;border-bottom:1px solid var(--border-subtle)}
.tab{
  padding:0 8px;font-size:13px;color:var(--text-tertiary);position:relative;display:flex;align-items:center
}
.tab:hover{color:var(--text-secondary)}
.tab.active{color:var(--text-primary)}
.tab.active::after{content:"";position:absolute;left:4px;right:4px;bottom:-1px;height:2px;background:var(--accent);border-radius:2px}
.panel-body{flex:1;min-height:0;overflow-y:auto;padding:14px}
.panel-section{margin-bottom:18px}
.panel-section h3{margin:0 0 8px;font-size:13px;font-weight:600}
.panel-section .sub{font-size:12px;color:var(--text-tertiary)}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.big-num{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.usage{height:6px;border-radius:3px;background:var(--surface-active);overflow:hidden;margin:8px 0 6px;display:flex}
.usage i{display:block;height:100%}
.usage i.seg1{background:#8ab4f8}
.usage i.seg2{background:#7fc8a9}
.usage i.seg3{background:#f0b46b}
.usage i.seg4{background:#a5a5f5}
.usage i.seg5{background:#d5d5d5}
.usage.warn{outline:1px solid var(--warn)}
.legend{font-size:12px;color:var(--text-tertiary)}
.detail-list{font-size:13px}
.detail-list div{height:24px;display:flex;align-items:center;gap:8px}
.detail-list .k{color:var(--text-secondary);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail-list .v{font-variant-numeric:tabular-nums}
.detail-list .mini{width:52px;height:4px;border-radius:2px;background:var(--surface-active)}
.detail-list .mini i{display:block;height:100%;border-radius:2px;background:var(--text-tertiary)}
.detail-list hr{border:0;border-top:1px solid var(--border-subtle);margin:4px 0}
.btn{
  height:34px;border-radius:9px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  font-size:13px;background:var(--surface-hover);color:var(--text-primary)
}
.btn:hover{background:var(--surface-active)}
.btn.primary{background:var(--accent);color:var(--bg-app);width:100%;font-weight:550}
html[data-theme="dark"] .btn.primary{color:#141414}
.btn.primary:disabled{opacity:.35;cursor:not-allowed}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn svg{width:14px;height:14px}
.compress-progress{margin-top:10px;font-size:13px;color:var(--text-secondary)}
.compress-progress .track{height:6px;border-radius:3px;background:var(--surface-active);overflow:hidden;margin:8px 0}
.compress-progress .track i{display:block;height:100%;background:var(--accent-soft);transition:width .2s}
.sum-list{font-size:13px;margin-top:6px}
.sum-item{display:flex;align-items:center;gap:8px;height:30px}
.sum-item .t{flex:1;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum-item .v{font-variant-numeric:tabular-nums;color:var(--text-tertiary);font-size:12px}
.sum-item .restore{font-size:12px;color:var(--accent-soft);opacity:0;transition:opacity .12s}
.sum-item:hover .restore{opacity:1}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--text-tertiary);margin-bottom:5px}
.field select,.field input[type=text]{
  width:100%;height:32px;border-radius:8px;border:1px solid var(--border-subtle);background:var(--bg-app);
  padding:0 9px;font-size:13px;outline:none
}
.field select:focus,.field input:focus{border-color:var(--accent-soft)}
.slider{width:100%}
.kv{display:flex;justify-content:space-between;font-size:13px;height:26px;align-items:center}
.kv span:first-child{color:var(--text-secondary)}
.danger-zone{margin-top:24px;padding-top:14px;border-top:1px solid var(--border-subtle)}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}

/* ---------------- 浮层 ---------------- */
#overlay-root{position:fixed;inset:0;pointer-events:none;z-index:60}
#overlay-root > *{pointer-events:auto}
.menu{
  position:fixed;min-width:200px;padding:5px;border-radius:var(--radius-menu);
  background:var(--surface-overlay);border:1px solid var(--border-subtle);box-shadow:var(--shadow-menu);
  animation:menuIn .12s ease
}
@keyframes menuIn{from{opacity:0;transform:translateY(-2px)}to{opacity:1;transform:none}}
.menu button{
  width:100%;height:32px;border-radius:7px;padding:0 10px;display:flex;align-items:center;gap:8px;
  font-size:13px;text-align:left
}
.menu button:hover,.menu button:focus-visible{background:var(--surface-hover)}

<script>
/* ============================================================
   全部为模拟数据，无任何网络请求 / 无后端
   ============================================================ */
(function(){
  "use strict";

  const MIN = 60e3, HOUR = 60*MIN, DAY = 24*HOUR;
  const now = Date.now();
  const MODEL_LIMIT = 20000;              // 模拟模型上下文上限
  const AUTO_COMPRESS_AT = 0.80;          // 自动压缩阈值
  const fmt = n => n.toLocaleString("en-US");

  /* ---------------- 模拟数据 ---------------- */
  const CHARACTERS = {
    alice: { id:"alice", name:"爱丽丝", color:"#3f8cff", tags:["奇幻","冒险"],
      desc:"白天是镇上钟表店的学徒，夜里替一位不肯露面的委托人抄写旧报纸。话不多，但对时间异常敏感。",
      system:"你扮演爱丽丝，一位对时间异常敏感的钟表店学徒。语气克制、观察细致，回答简短。" },
    butler:{ id:"butler", name:"管家", color:"#7c6cf0", tags:["悬疑","维多利亚"],
      desc:"老宅的管家，说话讲分寸，记忆里有很多不该记住的细节。",
      system:"你扮演维多利亚时代老宅的管家，措辞礼貌、克制，绝不主动失礼。" },

  };

  const clock = (d, h, m) => { const t = new Date(now - d*DAY); t.setHours(h, m, 0, 0); return +t; };
  const ago = ms => now - ms;

  let SEQ = 1000;
  const mid = () => "m" + (++SEQ);
  const est = text => {
    const s = String(text || "");
    const cjk = (s.match(/[\u3400-\u9fff\uf900-\ufaff]/g) || []).length;
    const other = s.replace(/[\u3400-\u9fff\uf900-\ufaff]/g, " ");
    return Math.max(1, Math.round(cjk * 0.85 + other.split(/\s+/).filter(Boolean).length * 1.35 + other.length / 12));
  };

  /** 造一条消息 */
  function msg(role, content, minsAgo, extra) {
    return Object.assign({
      id: mid(), role, content,
      at: now - minsAgo*MIN,
      archived: false,
      interrupted: false,
      meta: { model:"deepseek-chat", exact:true, elapsed: (1.8 + Math.random()*3).toFixed(1), ttft: 400 + Math.round(Math.random()*600) },
    }, extra || {});
  }

  const SUMMARIES = {
    s211: {
      id:"s211", coversFrom:1, coversTo:3, level:1, model:"claude-sonnet", tokenCount:184,
      content:[
        ["人物关系","爱丽丝与{{user}}在钟表店相识；她认得对方的脚步声。"],
        ["关键事件","主角替她修好了停摆的座钟，交换条件是陪她送一趟夜里的报纸。"],
        ["当前场景","雨后的石板街，报纸还剩三份未送。"],
        ["情绪与态度","她态度松动，但仍在提防对方追问委托人是谁。"],
        ["未回收伏笔","第三份报纸的收件人姓名被墨迹盖住。"],
        ["事实状态","时间：凌晨；地点：旧城石板街；持有物：三份报纸、一盏手灯。"],
      ],
    },
  };

  const conversations = [
    {
      id:"c1", title:"夜巡酒馆的第三夜", charId:"butler", pinned:false,
      created: ago(3*DAY), updated: ago(6*MIN), model:"deepseek-chat", temp:0.9, persona:"ASMobbin",
      summaries: [],
      messages:[
        msg("assistant","门从里面拉开一条缝。管家只露出半张脸，看清来人后才把门开大。\n\n「您比约定的时间早了十一分钟。」\n\n他侧身让开，走廊很深，尽头的灯只亮了一盏。", 42),
        msg("user","路上没堵。你说的东西，还在原来的位置？", 40),
        msg("assistant","「在。」他没有立刻带路，先把手里的烛台换到另一侧，「不过昨晚有人来过。架子上的第三样东西，被挪动过两指宽。」", 38),
      ],
    },
    {
      id:"c2", title:"修钟的代价", charId:"alice", pinned:true,
      created: ago(6*DAY), updated: ago(2*HOUR), model:"claude-sonnet", temp:0.8, persona:"ASMobbin",
      summaries: [ SUMMARIES.s211 ],
      messages:[
        msg("assistant","「齿轮不是坏了，是被人换过。」爱丽丝把镊子放下，指尖还沾着油。\n\n「换它的人很懂行——他知道该换哪一枚，也知道换完听不出来。」", 300, {archived:true}),
        msg("user","所以这钟从一开始就没打算走准？", 296, {archived:true}),
        msg("assistant","她没回答，转身把窗子推开一半，让街上的湿气进来。\n\n「你上次问我，委托人是谁。」", 292, {archived:true}),
        msg("user","嗯，你没说。", 288),
        msg("assistant","「现在也不能说。」她把手灯点亮，光柱里浮着灰，「但你可以跟我走一趟。报纸还剩三份。」", 285),
      ],

    {
      id:"c3", title:"关于盐与面粉的比例", charId:"mika", pinned:false,
      created: ago(1*DAY), updated: ago(5*HOUR), model:"deepseek-chat", temp:1.0, persona:"ASMobbin",
      summaries: [],
      messages:[
        msg("assistant","「二比一，别信食谱上写的三比一。」美嘉把面团翻了个面，「你家烤箱脾气大，盐少了会苦。」", 320),

      summaries: [],
      messages:[
        msg("assistant","「规矩是规矩。」他把账本合上，「三样东西里，只有一样是主人真正留下的。」", 1500),

      messages:[
        msg("assistant","「先去码头，再上山。」她把手灯举高了一点，「顺序错了，第三家会关窗。」", 11500),

  /* ---------------- 模拟回复 ---------------- */
  const REPLIES = [
    "「……」他停顿了一下，像是在权衡什么，「这话我听过一次，说的人后来没再来过。」",
    "「你确定要问这个？」她把杯子推远了一点，「答案不会让你今晚睡得更好。」",
    "窗外传来收摊的动静。他等那声音过去，才接着说：「继续。」",
    "「好。」她点头，语气忽然轻了，「那就按你说的来——不过先把手灯给我。」",
    "他伸手在空中比了一下，像在描一个不存在的轮廓：「大概这么宽，两指。挪动过两指。」",
  ];
  const KEEP_REPLIES = {
    greet: "「来了。」他侧身让开门口，「进来吧，外面风大。」",
    continue: "他沉默了两秒，像是把刚才的话在心里又过了一遍。\n\n「那就接着说吧。上次说到，你问他委托人是谁。」",
  };
  function mockReply(text) {
    const t = String(text);
    if (/^(你好|您好|嗨|hi|hello)/i.test(t)) return KEEP_REPLIES.greet;
    if (/继续|接着|然后呢/.test(t)) return KEEP_REPLIES.continue;
    const idx = Math.abs([...t].reduce((a,c)=>a+c.charCodeAt(0),0)) % REPLIES.length;
    // 避免连续两次相同
    const pick = REPLIES[idx] === mockReply.last ? REPLIES[(idx+1)%REPLIES.length] : REPLIES[idx];
    mockReply.last = pick;
    return pick;
  }
  function tokenUsage(c){
    const draft = $("#composer").value;
    const system = c ? est(CHARACTERS[c.charId].system) + 180 : 0;      // system + persona
    const fewShot = 420;                                              // 角色卡示例对话
    const summary = (c?.summaries || []).reduce((a,s)=>a+s.tokenCount, 0);
    const history = (c?.messages || []).filter(m=>!m.archived).reduce((a,m)=>a+est(m.content), 0);
    const input = est(draft);
    const total = system + fewShot + summary + history + input;
    return { system, fewShot, summary, history, input, total, pct: Math.min(1, total/MODEL_LIMIT) };
  }
  const unarchived = c => (c?.messages || []).filter(m=>!m.archived);

  /* ---------------- 状态 ---------------- */
  const state = {

    compress: null,           // {from,to,progress,timer}
    menu: null,               // {rect, items, ariaLabel}
    dialog: null,
    editingId: null,
    renamingId: null,
    expandedSummaries: new Set(["s211"]),
    metaAlways: false,
  };
  const $ = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));
  const conv = () => conversations.find(c=>c.id === state.activeId) || null;
  const charOf = c => CHARACTERS[c.charId];

  /* ---------------- 工具 ---------------- */
  function esc(s){ return String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
  function sorted(){
    const q = state.query.trim().toLowerCase();
    const list = conversations.filter(c => !q || c.title.toLowerCase().includes(q));
    return list.slice().sort((a,b)=>{
      const pa = a.pinned ? 1 : 0, pb = b.pinned ? 1 : 0;
      if (pa !== pb) return pb - pa;
      if (pa && pb) return b.pinnedAt - a.pinnedAt;
      return b.updated - a.updated;
    });
  }
  function toast(text){
    const el = document.createElement("div");
    el.className = "toast"; el.textContent = text;
    $("#toast-root").appendChild(el);
    setTimeout(()=>el.remove(), 2600);
  }
  const ICON = {
    dots:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>',
    copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 5H6a1 1 0 0 0-1 1v9"/></svg>',
    edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 20h4l10-10-4-4L4 16v4Z"/><path d="m14 6 4 4"/></svg>',
    redo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>',
    stop:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>',
    send:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
    chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>',
    pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 17v5"/><path d="M9 3h6l-1 6 3 3v2H7v-2l3-3-1-6Z"/></svg>',
    trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h16M10 7V5h4v2M6 7l1 13h10l1-13"/></svg>',
    export:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3v12M8 11l4 4 4-4"/><path d="M5 20h14"/></svg>',
  };

  /* ---------------- 左侧栏：列表 ---------------- */
  function renderList(){
    const box = $("#conv-list");
    const list = sorted();
    if (!list.length){
      box.innerHTML = `<div style="padding:10px 10px;font-size:13px;color:var(--text-tertiary)">
        ${state.query ? "没有匹配的对话" : '还没有对话　<a href="#" id="empty-new" style="color:var(--accent-soft)">新建一个 →</a>'}</div>`;
      return;
    }
    // 不按时间分组：只有「已置顶」（有置顶时）与其余全部会话两段
    const pinnedRows = list.filter(c => c.pinned);
    const rest = list.filter(c => !c.pinned);
    const showHead = (title) => `<div class="group-title"><span>${title}</span></div>`;
    let html = "";
    if (state.query){
      html += `<div class="group-title"><span>找到 ${list.length} 个对话</span></div>`;
    } else if (pinnedRows.length){
      html += showHead("已置顶");
    }
    const rowHTML = c => {
      const active = c.id === state.activeId;
      const streaming = state.streaming && state.streaming.convId === c.id;
      const title = state.query
        ? esc(c.title).replace(new RegExp("("+state.query.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"), "<b>$1</b>")
        : esc(c.title);
      return `<div class="conv-row${active?" active":""}" role="listitem" tabindex="0" data-id="${c.id}"
            aria-label="对话：${esc(c.title)}"${active?' aria-current="true"':''}>
          <span class="conv-title">${title}</span>
          ${streaming?'<span class="stream-dot" title="生成中"></span>':""}
          <button class="row-menu-btn" data-menu="${c.id}" aria-haspopup="menu" aria-label="更多操作：${esc(c.title)}" title="更多操作">${ICON.dots}</button>
        </div>`;
    };
    for (const c of pinnedRows) html += rowHTML(c);
    for (const c of rest) html += rowHTML(c);
    box.innerHTML = html;
    const en = $("#empty-new");
    if (en) en.addEventListener("click", e => { e.preventDefault(); newChat(); });
  }

  function rowRect(id){
    const row = $(`.conv-row[data-id="${id}"]`);
    const btn = row && row.querySelector(".row-menu-btn");
    return (btn || row || {getBoundingClientRect:()=>({left:120,top:200,bottom:230,right:180})}).getBoundingClientRect();
  }

  /* ---------------- 菜单（会话行与消息 toolbar 共用） ---------------- */
  function closeMenu(){
    state.menu = null;
    const el = $("#overlay-root .menu");
    if (el) el.remove();
  }
  function openMenu(anchorRect, items, ariaLabel){
    closeMenu();
    state.menu = { rect: anchorRect };
    const menu = document.createElement("div");
    menu.className = "menu";
    menu.setAttribute("role","menu");
    menu.setAttribute("aria-label", ariaLabel || "更多操作");
    menu.innerHTML = items.map((it,i)=> it === "-"
      ? "<hr>"
      : `<button role="menuitem" tabindex="-1" data-i="${i}" class="${it.danger?"danger":""}" ${it.disabled?"disabled":""}>${esc(it.label)}${it.kbd?`<span class="k">${esc(it.kbd)}</span>`:""}</button>`
    ).join("");
    $("#overlay-root").appendChild(menu);
    const r = menu.getBoundingClientRect();
    let left = anchorRect.right - r.width;
    let top = anchorRect.bottom + 6;
    if (left < 8) left = 8;
    if (left + r.width > innerWidth - 8) left = innerWidth - r.width - 8;
    if (top + r.height > innerHeight - 8) top = Math.max(8, anchorRect.top - r.height - 6);
    menu.style.left = left + "px";
    menu.style.top = top + "px";

    const focusables = () => Array.from(menu.querySelectorAll("button:not([disabled])"));
    focusables()[0]?.focus();
    menu.addEventListener("click", e => {
      const b = e.target.closest("button[data-i]");
      if (!b) return;
      const item = items[Number(b.dataset.i)];
      closeMenu();
      item.onSelect && item.onSelect();
    });
    menu.addEventListener("keydown", e => {
      const f = focusables(); const i = f.indexOf(document.activeElement);
      if (e.key === "ArrowDown"){ e.preventDefault(); f[(i+1) % f.length]?.focus(); }
      else if (e.key === "ArrowUp"){ e.preventDefault(); f[(i-1+f.length) % f.length]?.focus(); }
      else if (e.key === "Home"){ e.preventDefault(); f[0]?.focus(); }
      else if (e.key === "End"){ e.preventDefault(); f[f.length-1]?.focus(); }
    });
  }
  function convMenu(id){
    const c = conversations.find(x=>x.id===id);
    const count = c.messages.length;
    const sums = c.summaries.length;
    openMenu(rowRect(id), [
      { label:"重命名", kbd:"F2", onSelect:()=>startRename(id) },
      { label: c.pinned ? "取消置顶" : "置顶", onSelect:()=>togglePin(id) },
      "-",
      { label:"删除", danger:true, onSelect:()=>confirmDeleteConv(id, count, sums) },
    ], `更多操作：${c.title}`);
  }
  function togglePin(id){
    const c = conversations.find(x=>x.id===id);
    c.pinned = !c.pinned;
    if (c.pinned) c.pinnedAt = Date.now();     // 注意：不修改 updated
    renderList(); syncTopbar();
    const row = $(`.conv-row[data-id="${id}"]`);
    row?.animate?.([{transform:"translateY(-6px)"},{transform:"none"}], {duration:200, easing:"ease-out"});
  }

  /* ---------------- 重命名 ---------------- */
  function startRename(id){
    state.renamingId = id;
    renderList();
    const row = $(`.conv-row[data-id="${id}"]`);
    if (!row) return;
    const title = row.querySelector(".conv-title");
    const input = document.createElement("input");
    input.className = "rename-input"; input.value = conversations.find(c=>c.id===id).title;
    input.setAttribute("aria-label","重命名对话"); input.maxLength = 80;
    title.replaceWith(input);
    input.focus(); input.select();
    const commit = () => {
      const v = input.value.trim();
      const c = conversations.find(x=>x.id===id);
      if (!v){ input.classList.add("shake"); input.focus(); announce("标题不能为空"); return; }
      c.title = v;                       // 不修改 updated：排序不跳
      state.renamingId = null; renderList(); syncTopbar();
    };
    const cancel = () => { state.renamingId = null; renderList(); };
    input.addEventListener("keydown", e => {
      if (e.key === "Enter"){ e.preventDefault(); commit(); }
      else if (e.key === "Escape"){ e.preventDefault(); cancel(); }
    });
    input.addEventListener("blur", commit);
  }
  function announce(text){
    const el = $("#composer-hint");
    el.textContent = text; el.classList.add("warn");
    setTimeout(()=>{ el.textContent = "Demo 使用模拟数据 · 不发起任何网络请求"; el.classList.remove("warn"); }, 2200);
  }

  /* ---------------- 顶栏 ---------------- */
  function syncTopbar(){
    const c = conv();
    const titleEl = $("#chat-title");
    titleEl.textContent = c ? c.title : "对话";
    const pin = $("#pin-btn");
    pin.classList.toggle("on", !!(c && c.pinned));
    pin.setAttribute("aria-pressed", String(!!(c && c.pinned)));
    pin.title = c && c.pinned ? "取消置顶" : "置顶会话";
  }

  /* ---------------- 空态 / 线程 ---------------- */
  function renderThread(){
    const c = conv();
    const thread = $("#thread");
    if (!c){
      thread.innerHTML = `<div style="padding:22vh 0;text-align:center;color:var(--text-tertiary)">还没有对话</div>`;
      return;
    }
    const ch = charOf(c);
    if (!c.messages.length){
      thread.innerHTML = `<div class="empty">
        <h2>${esc(ch.name)}</h2>
        <p>${esc(ch.desc)}</p>
        <div class="chips">
          <button class="chip" data-open>「把手灯给我。」</button>
          <button class="chip" data-open>「委托人到底是谁？」</button>
          <button class="chip" data-open>「今晚还送报纸吗？」</button>
        </div>
      </div>`;
      return;
    }
    let html = "";
    let prevRole = null;
    for (let i = 0; i < c.messages.length; i++){
      const m = c.messages[i];
      const sameRole = prevRole === m.role;
      const isStreaming = state.streaming && state.streaming.msgId === m.id;
      const isEditing = state.editingId === m.id;
      // 摘要条落点：只在该段最后一条归档消息之后插一次
      const sumEnd = c.summaries.find(s => s.coversTo === i + 1);
      const sumStart = c.summaries.find(s => s.coversFrom > 0 && s.coversFrom - 1 === i);
      if (sumStart && !sumEnd) html += summaryHTML(sumStart);

      const ch2 = CHARACTERS[c.charId];
      let body = esc(m.content).replace(/\n/g,"<br>");
      if (isStreaming) body += '<span class="cursor"></span>';

      html += `<div class="msg ${m.role==="user"?"user":"assistant"}${sameRole?" same-role":""}${m.archived?" archived":""}" data-id="${m.id}">
        <div class="toolbar" role="toolbar" aria-label="消息操作">
          <button data-act="copy" title="复制">${ICON.copy}</button>
          ${m.role==="user" ? `<button data-act="edit" title="编辑">${ICON.edit}</button>` : ""}
          ${m.role!=="user" ? `<button data-act="redo" title="重新生成">${ICON.redo}</button>` : ""}
          <button data-act="more" title="更多" aria-haspopup="menu">${ICON.dots}</button>
        </div>
        <div class="head"><span class="name">${esc(ch2.name)}</span></div>
        <div class="body">${isEditing ? editHTML(m) : body}</div>
        ${m.interrupted && !isStreaming ? `<div class="interrupted-tag">已中断
            <button data-act="continue">继续</button></div>` : ""}
        ${m.error ? `<div class="error-bar">${esc(m.error.text)}<button data-act="retry">重试</button></div>` : ""}
        ${m.role!=="user" && !isStreaming ? `<div class="meta${state.metaAlways?" pinned":""}">
            ${esc(m.meta.model)} · ${m.meta.elapsed}s · ${fmt(est(m.content))} tok · ${m.meta.exact?"精确":"约（估算）"}</div>` : ""}
      </div>`;
      if (sumEnd) html += summaryHTML(sumEnd);
      prevRole = m.role;
    }
    thread.innerHTML = html;
  }
  function summaryHTML(s){
    const expanded = state.expandedSummaries.has(s.id);
    return `<div class="summary-divider" data-sum="${s.id}">
      <button class="summary-pill" data-act="toggle-sum">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 6h16M4 12h10M4 18h7"/></svg>
        已压缩 第 ${s.coversFrom}–${s.coversTo} 条 ${expanded?"⌃":"⌄"}
      </button></div>
      ${expanded ? `<div class="summary-body">
        <h4>摘要（覆盖 ${s.coversFrom}–${s.coversTo} 条 · ${fmt(s.tokenCount)} tok · ${esc(s.model)}）</h4>
        <ul>${s.content.map(([k,v])=>`<li><b>${esc(k)}</b>：${esc(v)}</li>`).join("")}</ul>
        <button class="restore" data-act="restore-sum" data-sum="${s.id}">恢复这段原文，摘要将失效</button>
      </div>`:""}`;
  }
  function editHTML(m){
    return `<textarea class="edit-area" data-edit="${m.id}">${esc(m.content)}</textarea>
      <div class="edit-actions">
        <span>截断后续消息？</span>
        <button class="btn" data-act="save-only" style="height:28px">仅保存</button>
        <button class="btn primary" data-act="save-truncate" style="height:28px;width:auto">保存并截断</button>
        <button class="btn" data-act="cancel-edit" style="height:28px">取消</button>
        <span class="inline-error" id="edit-error"></span>
      </div>`;
  }

  /* ---------------- 消息流滚动 ---------------- */
  let stickBottom = true;
  function scrollBottom(smooth){ $("#scroll").scrollTo({top: $("#scroll").scrollHeight, behavior: smooth?"smooth":"auto"}); }
  $("#scroll").addEventListener("scroll", () => {
    const el = $("#scroll");
    stickBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
    $("#to-latest").classList.toggle("show", !stickBottom);
  });
  $("#to-latest").addEventListener("click", () => scrollBottom(true));

  /* ---------------- 输入区 ---------------- */
  const composer = $("#composer");
  function autoGrow(){
    composer.style.height = "auto";
    composer.style.height = Math.min(200, composer.scrollHeight) + "px";
  }
  function renderMeter(){
    const c = conv();
    const u = tokenUsage(c);
    const meter = $("#meter");
    const busy = state.streaming && state.streaming.convId === state.activeId;
    const comp = state.compress;
    let text = busy ? "生成中…" : comp ? "压缩中…" : `上下文 ${Math.round(u.pct*100)}%`;
    if (state.panelOpen === false && c && !busy && !comp) text = `上下文 ${Math.round(u.pct*100)}%`;
    $("#meter-text").textContent = text;
    $("#meter-bar").style.width = Math.round(u.pct*100) + "%";
    meter.classList.toggle("warn", !comp && !busy && u.pct >= 0.75 && u.pct < AUTO_COMPRESS_AT);
    meter.classList.toggle("danger", !comp && !busy && u.pct >= AUTO_COMPRESS_AT);
    const send = $("#send-btn");
    if (busy){
      send.classList.add("stop"); send.disabled = false;
      send.innerHTML = ICON.stop; send.setAttribute("aria-label","停止生成");
    } else {
      send.classList.remove("stop");
      send.disabled = !composer.value.trim() || !c;
      send.innerHTML = ICON.send; send.setAttribute("aria-label","发送");
    }
  }
  composer.addEventListener("input", () => { autoGrow(); renderMeter(); renderPanel(); });
  composer.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      send();
    }
  });
  $("#send-btn").addEventListener("click", () => {
    if (state.streaming) stopStreaming();
    else send();
  });

  /* ---------------- 模拟流式 ---------------- */
  function appendMsg(c, role, content, extra){
    const m = msg(role, content, 0, extra);
    m.at = Date.now();
    c.messages.push(m);
    c.updated = Date.now();
    return m;
  }
  function send(){
    const c = conv();
    const text = composer.value.trim();
    if (!c || !text || state.streaming) return;
    composer.value = ""; autoGrow();
    appendMsg(c, "user", text);
    if (c.messages.filter(m=>m.role==="user").length === 1){
      c.title = text.length > 12 ? text.slice(0,12) + "…" : text;   // 首条消息生成标题
    }
    renderList(); syncTopbar(); renderThread(); renderPanel(); renderMeter();
    scrollBottom(true);
    maybeAutoCompress(c);
    streamReply(c);
  }
  function streamReply(c){
    const full = mockReply($("#composer").value || (c.messages[c.messages.length-1]||{}).content || "");
    const m = appendMsg(c, "assistant", "");
    state.streaming = { convId: c.id, msgId: m.id, full, shown: 0 };
    renderList(); renderThread(); renderMeter(); renderPanel();
    stickBottom = true; scrollBottom(true);
    tickStream();
  }
  function tickStream(){
    const s = state.streaming;
    if (!s) return;
    const c = conversations.find(x=>x.id === s.convId);
    const m = c.messages.find(x=>x.id === s.msgId);
    s.shown = Math.min(s.full.length, s.shown + 1 + Math.round(Math.random()*2));
    m.content = s.full.slice(0, s.shown);
    // 增量更新 DOM，避免整块重渲染
    const el = $(`.msg[data-id="${m.id}"] .body`);
    if (el) el.innerHTML = esc(m.content).replace(/\n/g,"<br>") + '<span class="cursor"></span>';
    if (stickBottom) $("#scroll").scrollTop = $("#scroll").scrollHeight;
    if (s.shown < s.full.length){
      s.timer = setTimeout(tickStream, 16 + Math.random()*26);
    } else {
      finishStreaming(false);
    }
  }
  function stopStreaming(){
    const s = state.streaming;
    if (!s) return;
    clearTimeout(s.timer);
    const c = conversations.find(x=>x.id === s.convId);
    const m = c.messages.find(x=>x.id === s.msgId);
    m.interrupted = true;
    finishStreaming(true);
  }
  function finishStreaming(stopped){
    const s = state.streaming;
    state.streaming = null;
    const c = conversations.find(x=>x.id === s.convId);
    const m = c.messages.find(x=>x.id === s.msgId);
    const u = tokenUsage(c);
    m.meta.elapsed = (1.5 + Math.random()*3).toFixed(1);
    renderThread(); renderPanel(); renderMeter();
    if (c.id === state.activeId && !stopped) toast(`已生成 · ${fmt(est(m.content))} tok`);
    if (!stopped) maybeAutoCompress(c);
  }

  /* ---------------- 压缩（状态机） ---------------- */
  function maybeAutoCompress(c){
    const u = tokenUsage(c);
    if (u.pct < AUTO_COMPRESS_AT || state.compress) return;
    const targets = unarchived(c).slice(0, 8);
    if (targets.length < 4) return;
    startCompress(c, targets, true);
  }
  function startCompress(c, targets, auto){
    const before = tokenUsage(c).total;
    state.compress = { convId: c.id, ids: targets.map(m=>m.id), progress: 0, auto, saved: 0 };
    state.panelTab = "context";
    setPanelTab("context", true);
    const total = targets.length;
    const step = () => {
      const cmp = state.compress;
      if (!cmp) return;
      cmp.progress += 1;
      renderMeter(); renderPanel();
      if (cmp.progress >= total){
        const from = c.messages.findIndex(m=>m.id === targets[0].id) + 1;
        const to = c.messages.findIndex(m=>m.id === targets[targets.length-1].id) + 1;
        targets.forEach(m => { m.archived = true; });
        const sum = {
          id: "s" + Date.now(), coversFrom: from, coversTo: to, level: 1,
          model: c.model, tokenCount: Math.round(before * 0.14),
          content: [
            ["人物关系","{{user}} 与 " + CHARACTERS[c.charId].name + " 的关系在本段中进一步确立，出现一次明确的让步。"],
            ["关键事件",`主角追问了「${(targets.find(m=>m.role==="user")||targets[0]).content.slice(0,14)}…」相关的事，对方给出了部分答案。`],
            ["当前场景","时间推进到当晚，地点未变，环境细节（灯、雨、气味）被保留。"],
            ["情绪与态度","对方态度从回避转为有限合作，仍保留一处未说明的动机。"],
            ["未回收伏笔","一处被刻意跳过的名字，尚未被解释。"],
            ["事实状态","持有物与时间线索保持连续，无冲突。"],
          ],
        };
        c.summaries.push(sum);   // 渲染时按 coversFrom/coversTo 定位分割条
        state.expandedSummaries.add(sum.id);
        const after = tokenUsage(c).total;
        state.compress = null;
        renderList(); renderThread(); renderPanel(); renderMeter();
        toast(`已将第 ${from}–${to} 条压缩（${fmt(before)} → ${fmt(after)} tokens）`);
      } else {
        state.compress.timer = setTimeout(step, 240);
      }
    };
    state.compress.timer = setTimeout(step, 700);   // 首步稍慢，让"压缩中"状态可被看到
    renderMeter(); renderPanel();
  }
  function cancelCompress(){
    if (!state.compress) return;
    clearTimeout(state.compress.timer);
    const cmp = state.compress;
    state.compress = null;
    renderMeter(); renderPanel();
    toast("已取消压缩：未写入摘要，归档标记未改变");
  }
  function restoreSummary(sumId){
    const c = conv();
    const s = c.summaries.find(x=>x.id === sumId);
    if (!s) return;
    const ids = c.messages.slice(Math.max(0,s.coversFrom-1), s.coversTo).map(m=>m.id);
    c.messages.forEach(m => { if (ids.includes(m.id)) m.archived = false; });
    c.summaries = c.summaries.filter(x=>x.id !== sumId);
    state.expandedSummaries.delete(sumId);
    renderThread(); renderPanel(); renderMeter(); renderList();
    toast(`已恢复第 ${s.coversFrom}–${s.coversTo} 条，对应摘要已失效`);
  }

  /* ---------------- 消息交互 ---------------- */
  $("#thread").addEventListener("click", e => {
    const chip = e.target.closest("[data-open]");
    if (chip){ composer.value = chip.textContent.replace(/[「」]/g,""); autoGrow(); renderMeter(); send(); return; }

    const sumToggle = e.target.closest('[data-act="toggle-sum"]');
    if (sumToggle){
      const id = sumToggle.closest(".summary-divider").dataset.sum;
      state.expandedSummaries.has(id) ? state.expandedSummaries.delete(id) : state.expandedSummaries.add(id);
      renderThread(); return;
    }
    const restore = e.target.closest('[data-act="restore-sum"]');
    if (restore){ restoreSummary(restore.dataset.sum); return; }

    const msgEl = e.target.closest(".msg");
    const act = e.target.closest("[data-act]");
    if (!msgEl || !act) return;
    const id = msgEl.dataset.id;
    const c = conv();
    const m = c.messages.find(x=>x.id === id);
    switch(act.dataset.act){
      case "copy":
        navigator.clipboard?.writeText(m.content);
        toast("已复制这条消息");
        break;
      case "edit":
        state.editingId = id; renderThread();
        $(".edit-area")?.focus();
        break;
      case "cancel-edit":
        state.editingId = null; renderThread();
        break;
      case "save-only":
      case "save-truncate": {
        const ta = msgEl.querySelector(".edit-area");
        const v = ta.value.trim();
        if (!v){ $("#edit-error").textContent = "内容不能为空"; return; }
        m.content = v;
        const truncate = act.dataset.act === "save-truncate";
        let cascade = 0;
        if (truncate){
          const idx = c.messages.indexOf(m);
          const removed = c.messages.slice(idx+1).map(x=>x.id);
          // 摘要级联失效
          c.summaries = c.summaries.filter(s => {
            const hit = idx + 1 <= s.coversTo;
            if (hit) cascade += 1;
            return !hit;
          });
          c.messages = c.messages.slice(0, idx+1);
          c.messages.forEach(x => { if (removed.includes(x.id)) x.archived = false; });
        }
        state.editingId = null;
        renderThread(); renderPanel(); renderMeter(); renderList();
        toast(truncate ? `已保存并截断后续消息${cascade?`，${cascade} 段摘要失效`:""}` : "已保存");
        break;
      }
      case "redo":
        m.content = "……";
        renderThread();
        streamReplace(c, m);
        break;
      case "continue":
        m.interrupted = false; renderThread(); streamReply(c);
        break;
      case "retry":
        m.error = null;
        renderThread();
        streamReply(c);
        break;
      case "more": {
        const r = act.getBoundingClientRect();
        const idx = c.messages.indexOf(m);
        openMenu(r, [
          { label:"复制内容", onSelect:()=>{ navigator.clipboard?.writeText(m.content); toast("已复制"); } },
          { label:"删除这一条", danger:true, onSelect:()=>{ c.messages.splice(idx,1); renderThread(); renderPanel(); renderMeter(); renderList(); toast("已删除 1 条消息"); } },
          { label:"删除以下全部", danger:true, onSelect:()=>{ c.messages = c.messages.slice(0, idx+1); renderThread(); renderPanel(); renderMeter(); renderList(); toast("已删除后续消息"); } },
        ], "消息操作");
        break;
      }
    }
  });
  function streamReplace(c, m){
    const full = mockReply(m.content === "……" ? "继续" : m.content);
    m.content = "";
    state.streaming = { convId:c.id, msgId:m.id, full, shown:0 };
    renderList(); renderMeter();
    tickStream();
  }

  /* ---------------- 右栏 ---------------- */
  const TABS = ["context","conversation","character","data"];
  function setPanelTab(tab, silent){
    state.panelTab = tab;
    $$("#panel .tab").forEach(t => t.classList.toggle("active", t.dataset.tab === tab));
    renderPanel();
    if (!silent) $("#panel").classList.remove("hidden");
  }
  $$("#panel .tab").forEach(t => t.addEventListener("click", () => setPanelTab(t.dataset.tab)));

  function renderPanel(){
    const c = conv();
    const body = $("#panel-body");
    if (!c){ body.innerHTML = `<div class="sub">选择一个对话查看详情</div>`; return; }
    const ch = charOf(c);
    const u = tokenUsage(c);
    if (state.panelTab === "context"){
      const pct = Math.round(u.pct*100);
      const targets = unarchived(c).slice(0,8);
      const saving = Math.round(tokenUsage(c).total * 0.14);
      const sumRows = c.summaries.map(s=>`<div class="sum-item">
          <span class="t">第 ${s.coversFrom}–${s.coversTo} 条</span>
          <span class="v">${fmt(s.tokenCount)} tok</span>
          <button class="restore" data-restore="${s.id}">恢复</button>
        </div>`).join("") || `<div class="sub">还没有压缩过</div>`;
      body.innerHTML = `
        <div class="panel-section">
          <div class="row-between">
            <span class="sub">自动压缩（80%）</span>
            <button class="btn" style="height:26px" data-goto="settings">已开启 · 去设置</button>
          </div>
        </div>
        <div class="panel-section">
          <div class="row-between"><h3>上下文占用</h3><span class="big-num ${pct>=80?"":pct>=75?"":""}" style="color:${pct>=80?"var(--danger)":pct>=75?"var(--warn)":"inherit"}">${pct}%</span></div>
          <div class="usage${pct>=75?" warn":""}">
            ${seg("seg1",u.system)}${seg("seg2",u.fewShot)}${seg("seg3",u.summary)}${seg("seg4",u.history)}${seg("seg5",u.input)}
          </div>
          <div class="row-between">
            <span class="legend">${fmt(u.total)} / ${fmt(MODEL_LIMIT)} tok</span>
            <span class="legend">${c.model === "deepseek-chat" ? "精确" : "约（估算）"}</span>
          </div>
        </div>
        <div class="panel-section">
          <h3>明细</h3>
          <div class="detail-list">
            ${detailRow("system",u.system,u.total)}${detailRow("few-shot",u.fewShot,u.total)}
            ${detailRow(`摘要(${c.summaries.length} 段)`,u.summary,u.total)}
            ${detailRow(`历史(${unarchived(c).length} 条)`,u.history,u.total)}
            ${detailRow("本次输入",u.input,u.total)}
            <hr>
            <div><span class="k">合计</span><span class="v">${fmt(u.total)}</span></div>
          </div>
        </div>
        <div class="panel-section">
          ${state.compress ? `
            <div class="btn primary" style="pointer-events:none">压缩中 ${state.compress.progress}/${state.compress.ids.length} 段…</div>
            <div class="compress-progress">
              <div class="track"><i style="width:${Math.round(state.compress.progress/state.compress.ids.length*100)}%"></i></div>
              <button class="btn block" data-cancel-compress>取消压缩</button>
            </div>`
          : `<button class="btn primary" id="compress-btn" ${targets.length<4?"disabled":""}>
               压缩最老的 ${Math.min(8,targets.length)} 条（约省 ${fmt(saving)} tok）
             </button>`}
        </div>
        <div class="panel-section">
          <div class="row-between"><h3>压缩历史 · ${c.summaries.length} 段</h3></div>
          <div class="sum-list">${sumRows}</div>
        </div>
        <div class="panel-section">
          <h3>本次消耗</h3>
          <div class="kv"><span>用时</span><span>${(1.5+Math.random()*3).toFixed(1)}s</span></div>
          <div class="kv"><span>tokens</span><span>${fmt(u.total)}</span></div>
          <div class="kv"><span>TTFT</span><span>640ms</span></div>
          <div class="kv"><span>费用（模拟）</span><span>$0.0032</span></div>
        </div>`;
      $("#compress-btn")?.addEventListener("click", () => {
        const t = unarchived(c).slice(0,8);
        if (t.length >= 4) startCompress(c, t, false);
      });
      $("[data-cancel-compress]")?.addEventListener("click", cancelCompress);
      $$("[data-restore]").forEach(b => b.addEventListener("click", () => restoreSummary(b.dataset.restore)));
      $('[data-goto="settings"]')?.addEventListener("click", () => toast("Demo 中「设置」为占位页"));
    }

    if (state.panelTab === "conversation"){
      body.innerHTML = `
        <div class="panel-section">
          <h3>本次对话使用</h3>
          <div class="field"><label>Provider / 模型</label>
            <select id="p-model">
              ${["deepseek-chat","claude-sonnet","gpt-4o-mini"].map(m=>`<option ${m===c.model?"selected":""}>${m}</option>`).join("")}
            </select></div>
          <div class="field"><label>人设</label>
            <select id="p-persona">${["ASMobbin","默认人设"].map(p=>`<option ${p===c.persona?"selected":""}>${p}</option>`).join("")}</select></div>
        </div>
        <div class="panel-section">
          <h3>生成参数（会话级覆盖）</h3>
          <div class="field"><label>temperature <span id="temp-v">${c.temp.toFixed(1)}</span></label>
            <input class="slider" type="range" id="p-temp" min="0" max="2" step="0.1" value="${c.temp}"></div>
          <div class="field"><label>top_p <span id="topp-v">0.95</span></label>
            <input class="slider" type="range" id="p-topp" min="0" max="1" step="0.05" value="0.95"></div>
          <div class="field"><label>max_tokens</label><input type="text" value="1024"></div>
        </div>
        <div class="panel-section">
          <h3>开场白</h3>
          <button class="btn block" id="p-restart">用开场白重开这个会话</button>
          <div class="sub" style="margin-top:8px">重开会保留角色卡与参数，清空消息历史。</div>
        </div>`;
      $("#p-model").addEventListener("change", e => { c.model = e.target.value; $("#model-name").textContent = c.model; renderPanel(); renderThread(); });
      $("#p-persona").addEventListener("change", e => { c.persona = e.target.value; $("#persona-name").textContent = "人设 " + c.persona; });
      $("#p-temp").addEventListener("input", e => { c.temp = Number(e.target.value); $("#temp-v").textContent = c.temp.toFixed(1); $("#param-name").textContent = "temp " + c.temp.toFixed(1); });
      $("#p-topp").addEventListener("input", e => { $("#topp-v").textContent = Number(e.target.value).toFixed(2); });
      $("#p-restart").addEventListener("click", () => { c.messages = []; c.summaries = []; c.updated = Date.now(); renderThread(); renderPanel(); renderMeter(); renderList(); toast("会话已用开场白重开"); });
    }

    if (state.panelTab === "character"){
      body.innerHTML = `
        <div class="panel-section">
          <h3>${esc(ch.name)}</h3>
          <div class="tag-list">${ch.tags.map(t=>`<span class="chip" style="padding:3px 9px;font-size:12px">${esc(t)}</span>`).join("")}</div>
        </div>
        <div class="panel-section">
          <h3>角色描述</h3>
          <div class="sub" style="line-height:22px">${esc(ch.desc)}</div>
        </div>
        <div class="panel-section">
          <h3>系统提示（截断预览）</h3>
          <div class="sub" style="line-height:22px">${esc(ch.system)}</div>
        </div>
        <div class="panel-section">
          <button class="btn block" id="p-edit-char">编辑角色卡</button>
          <div class="sub" style="margin-top:8px">角色卡解析与导入导出见产品设计文档 3.2（本期不做 PNG 解析）。</div>
        </div>`;
      $("#p-edit-char").addEventListener("click", () => toast("Demo：角色卡编辑器未实现（见设计稿 6 节「编辑角色卡」）"));
    }

    if (state.panelTab === "data"){
      const archived = c.messages.filter(m=>m.archived).length;
      body.innerHTML = `
        <div class="panel-section">
          <h3>会话信息</h3>
          <div class="kv"><span>消息</span><span>${c.messages.length} 条（归档 ${archived}）</span></div>
          <div class="kv"><span>摘要</span><span>${c.summaries.length} 段</span></div>
          <div class="kv"><span>创建</span><span>${new Date(c.created).toLocaleDateString("zh-CN")}</span></div>
          <div class="kv"><span>更新</span><span>${new Date(c.updated).toLocaleString("zh-CN",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"})}</span></div>
        </div>
        <div class="panel-section">
          <h3>导出</h3>
          <button class="btn block" id="p-export-md" style="margin-bottom:8px">导出 Markdown</button>
          <button class="btn block" id="p-export-json">导出 JSON</button>
          <div class="sub" style="margin-top:8px">Demo 仅在本地生成并下载文件。</div>
        </div>
        <div class="danger-zone">
          <h3 style="font-size:13px;margin:0 0 8px">危险区</h3>
          <button class="btn danger block" id="p-delete">删除这个对话</button>
        </div>`;
      $("#p-export-md").addEventListener("click", () => downloadExport(c, "md"));
      $("#p-export-json").addEventListener("click", () => downloadExport(c, "json"));
      $("#p-delete").addEventListener("click", () => confirmDeleteConv(c.id, c.messages.length, c.summaries.length));
    }
  }
  const seg = (cls,v) => `<i class="${cls}" style="width:${(v/MODEL_LIMIT*100).toFixed(2)}%"></i>`;
  const detailRow = (k,v,total) => `<div><span class="k">${esc(k)}</span>
      <span class="mini"><i style="width:${Math.min(100,(v/Math.max(1,total))*100).toFixed(0)}%"></i></span>
      <span class="v">${fmt(v)}</span></div>`;

  function downloadExport(c, kind){
    const ch = charOf(c);
    let text, name;
    if (kind === "md"){
      text = `# ${c.title}\n\n角色：${ch.name}　模型：${c.model}　导出时间：${new Date().toLocaleString("zh-CN")}\n\n`;
      text += c.messages.map(m => `**${m.role === "user" ? c.persona : ch.name}**\n\n${m.content}\n`).join("\n---\n\n");
      if (c.summaries.length) text += `\n\n## 摘要\n\n` + c.summaries.map(s=>`- 第 ${s.coversFrom}–${s.coversTo} 条（${s.tokenCount} tok，${s.model}）\n` + s.content.map(([k,v])=>`  - ${k}：${v}`).join("\n")).join("\n");
      name = c.title + ".md";
    } else {
      text = JSON.stringify({ title:c.title, character:ch.name, model:c.model, persona:c.persona,
        created:c.created, updated:c.updated, summaries:c.summaries, messages:c.messages }, null, 2);
      name = c.title + ".json";
    }
    const blob = new Blob([text], {type:"text/plain;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
    toast(`已导出 ${name}`);
  }

  /* ---------------- 对话框 ---------------- */
  function openDialog(node){
    closeDialog();
    state.dialog = node;
    $("#overlay-root").appendChild(node);
    node.querySelector(".btn,button:not(.btn)")?.focus();
  }
  function closeDialog(){
    const el = $("#overlay-root .scrim");
    if (el) el.remove();
    state.dialog = null;
  }
  function confirmDeleteConv(id, count, sums){
    const c = conversations.find(x=>x.id === id);
    const scrim = document.createElement("div");
    scrim.className = "scrim";
    scrim.innerHTML = `<div class="dialog" role="dialog" aria-modal="true" aria-label="删除对话">
      <h3>删除对话？</h3>
      <p>「${esc(c.title)}」</p>
      <p>共 ${count} 条消息${sums?`，其中 ${sums} 段摘要将一并删除`:""}。</p>
      <p>此操作不可撤销。</p>
      <div class="actions">
        <button class="btn" data-no>取消</button>
        <button class="btn confirm-danger" data-yes>删除</button>
      </div>
    </div>`;
    scrim.addEventListener("click", e => { if (e.target === scrim) closeDialog(); });
    scrim.querySelector("[data-no]").addEventListener("click", closeDialog);
    scrim.querySelector("[data-yes]").addEventListener("click", () => {
      const wasActive = state.activeId === id;
      const list = sorted();
      const idx = list.findIndex(x=>x.id === id);
      const nextId = list[idx+1]?.id || list[idx-1]?.id || null;
      const pos = conversations.findIndex(x=>x.id === id);
      conversations.splice(pos,1);            // 事务：会话 + 消息 + 摘要一起走
      closeDialog();
      if (wasActive){
        state.activeId = conversations.some(x=>x.id===nextId) ? nextId : (conversations[0]?.id || null);
        state.expandedSummaries.clear();
      }
      renderList(); syncTopbar(); renderThread(); renderPanel(); renderMeter();
      if (!conversations.length) toast("列表已空");
    });
    openDialog(scrim);
  }
  function newChat(){
    const ch = CHARACTERS.alice;
    const c = { id:"c" + Date.now(), title:"新对话", charId:ch.id, pinned:false,
      created:Date.now(), updated:Date.now(), model:"deepseek-chat", temp:0.9, persona:"ASMobbin",
      summaries:[], messages:[] };
    conversations.unshift(c);
    state.activeId = c.id;
    renderList(); syncTopbar(); renderThread(); renderPanel(); renderMeter();
    composer.focus();
    toast("已新建对话（选角色 → 开场白）");
  }

  /* ---------------- 全局事件 ---------------- */
  $("#conv-list").addEventListener("click", e => {
    const btn = e.target.closest(".row-menu-btn");
    if (btn){ e.stopPropagation(); convMenu(btn.dataset.menu); return; }
    const row = e.target.closest(".conv-row");
    if (row && row.dataset.id !== state.activeId){
      if (state.streaming) { /* 切换不打断生成 */ }
      state.activeId = row.dataset.id;
      state.editingId = null;
      renderList(); syncTopbar(); renderThread(); renderPanel(); renderMeter();
      scrollBottom(false);
    }
  });
  $("#conv-list").addEventListener("contextmenu", e => {
    const row = e.target.closest(".conv-row");
    if (!row) return;
    e.preventDefault();
    convMenu(row.dataset.id);
  });
  $("#conv-list").addEventListener("keydown", e => {
    const row = e.target.closest(".conv-row");
    if (!row) return;
    const rows = $$(".conv-row");
    const i = rows.indexOf(row);
    if (e.key === "ArrowDown"){ e.preventDefault(); rows[Math.min(rows.length-1,i+1)]?.focus(); }
    else if (e.key === "ArrowUp"){ e.preventDefault(); rows[Math.max(0,i-1)]?.focus(); }
    else if (e.key === "Enter"){ e.preventDefault(); row.click(); }
    else if (e.key === "F2"){ e.preventDefault(); startRename(row.dataset.id); }
    else if (e.key === "Delete"){ e.preventDefault();
      const c = conversations.find(x=>x.id === row.dataset.id);
      confirmDeleteConv(c.id, c.messages.length, c.summaries.length); }
    else if (e.key === "F10" && e.shiftKey){ e.preventDefault(); convMenu(row.dataset.id); }
  });
  $("#collapse-btn").addEventListener("click", () => {
    $("#sidebar").classList.toggle("collapsed");
  });
  $("#sidebar .sidebar-head").addEventListener("dblclick", () => $("#sidebar").classList.toggle("collapsed"));
  $("#new-chat").addEventListener("click", newChat);
  $("#list-new").addEventListener("click", newChat);
  $("#search-input").addEventListener("input", e => { state.query = e.target.value; renderList(); });
  $("#search-input").addEventListener("keydown", e => {
    if (e.key === "Escape"){ e.target.value = ""; state.query = ""; renderList(); }
  });
  $("#nav").addEventListener("click", e => {
    const item = e.target.closest(".nav-item");
    if (!item) return;
    state.view = item.dataset.view;
    $$(".nav-item").forEach(n => n.classList.toggle("active", n === item));
    if (state.view === "chat"){
      renderThread(); renderPanel();
    } else {
      const names = { characters:"角色库", personas:"人设", settings:"设置" };
      $("#thread").innerHTML = `<div style="padding:20vh 0;text-align:center">
        <div style="font-size:15px;color:var(--text-secondary)">${names[state.view]}（Demo 未实现）</div>
        <div class="sub" style="margin-top:8px;color:var(--text-tertiary)">本 Demo 聚焦对话界面与左栏交互，此页面见设计稿</div>
        <button class="btn" style="margin-top:16px" id="back-chat">返回对话</button></div>`;
      $("#back-chat").addEventListener("click", () => $('.nav-item[data-view="chat"]').click());
    }
  });
  $("#pin-btn").addEventListener("click", () => { const c = conv(); if (c) togglePin(c.id); });
  $("#theme-btn").addEventListener("click", () => {
    const root = document.documentElement;
    root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
  });
  $("#panel-btn").addEventListener("click", () => togglePanel());
  function togglePanel(){
    state.panelOpen = !state.panelOpen;
    $("#panel").classList.toggle("hidden", !state.panelOpen);
    $("#panel-btn").setAttribute("aria-pressed", String(state.panelOpen));
    renderMeter();
  }
  $("#meter").addEventListener("click", () => {
    if (!state.panelOpen) togglePanel();
    setPanelTab("context");
  });
  $("#model-chip").addEventListener("click", e => {
    const r = e.currentTarget.getBoundingClientRect();
    openMenu(r, [
      { label:"deepseek-chat", onSelect:()=>setModel("deepseek-chat") },
      { label:"claude-sonnet", onSelect:()=>setModel("claude-sonnet") },
      { label:"gpt-4o-mini", onSelect:()=>setModel("gpt-4o-mini") },
      "-",
      { label:"跳到设置", onSelect:()=>toast("Demo 中「设置」为占位页") },
    ], "选择模型");
  });
  function setModel(m){ const c = conv(); if (c) c.model = m; $("#model-name").textContent = m; renderPanel(); renderThread(); }
  $("#composer-more").addEventListener("click", e => {
    const r = e.currentTarget.getBoundingClientRect();
    openMenu(r, [
      { label:"用开场白重开", onSelect:()=>{ const c = conv(); c.messages=[]; c.summaries=[]; renderThread(); renderPanel(); renderMeter(); renderList(); toast("已重开"); } },
      { label:"显示 token 元信息", onSelect:()=>{ state.metaAlways = !state.metaAlways; renderThread(); } },
      { label:"导出 Markdown", onSelect:()=>downloadExport(conv(), "md") },
    ], "会话操作");
  });
  $("#param-chip").addEventListener("click", () => { setPanelTab("conversation"); if (!state.panelOpen) togglePanel(); });
  $("#persona-chip").addEventListener("click", () => { setPanelTab("conversation"); if (!state.panelOpen) togglePanel(); });
  $("#persona-foot").addEventListener("click", e => {
    if (e.target.closest("button")){
      const r = e.target.closest("button").getBoundingClientRect();
      openMenu(r, [
        { label:"切换人设", onSelect:()=>{ setPanelTab("conversation"); if (!state.panelOpen) togglePanel(); } },
        { label:"人设管理", onSelect:()=>toast("Demo：人设管理未实现") },
      ], "人设选项");
      return;
    }
    setPanelTab("conversation"); if (!state.panelOpen) togglePanel();
  });
  $("#chat-title").addEventListener("dblclick", () => { if (conv()) startRename(state.activeId); });
  $("#chat-title").addEventListener("keydown", e => { if (e.key === "F2"){ e.preventDefault(); startRename(state.activeId); } });
  $("#topbar").addEventListener("mouseenter", () => $("#topbar").classList.add("pin-visible"));

  /* 全局快捷键与关闭 */
  document.addEventListener("keydown", e => {
    const mod = e.ctrlKey || e.metaKey;
    if (mod && e.key.toLowerCase() === "k"){ e.preventDefault(); $("#search-input").focus(); $("#search-input").select(); return; }
    if (mod && e.key.toLowerCase() === "n"){ e.preventDefault(); newChat(); return; }
    if (mod && e.key.toLowerCase() === "b"){ e.preventDefault(); $("#sidebar").classList.toggle("collapsed"); return; }
    if (mod && e.key.toLowerCase() === "i"){ e.preventDefault(); togglePanel(); return; }
    if (mod && ["1","2","3","4"].includes(e.key)){
      e.preventDefault();
      if (!state.panelOpen) togglePanel();
      setPanelTab(TABS[Number(e.key)-1]);
      return;
    }
    if (e.key === "Escape"){
      if (state.dialog){ closeDialog(); return; }
      if (state.menu){ closeMenu(); $(".row-menu-btn")?.focus(); return; }
      if (state.editingId){ state.editingId = null; renderThread(); return; }
      if (state.streaming){ stopStreaming(); return; }
    }
  });
  document.addEventListener("mousedown", e => {
    if (state.menu && !e.target.closest(".menu") && !e.target.closest("[data-menu]") && !e.target.closest("#model-chip") && !e.target.closest("#composer-more") && !e.target.closest(".toolbar") && !e.target.closest("#persona-foot")){
      closeMenu();
    }
  });
  document.addEventListener("scroll", () => { if (state.menu) closeMenu(); }, true);
  addEventListener("resize", () => { if (state.menu) closeMenu(); });

  /* ---------------- 启动 ---------------- */
  function boot(){
    composer.value = "";
    autoGrow();
    renderList(); syncTopbar(); renderThread(); renderPanel(); renderMeter();
    if (innerWidth < 860) $("#sidebar").classList.add("collapsed");
    scrollBottom(false);
    // 首次打开时给个提示：Demo 无后端
    setTimeout(()=>toast("Demo：全部数据为模拟，无后端请求"), 600);
  }
  boot();
  window.__cottageDemo = { conversations, state, tokenUsage, CHARACTERS };  // 便于人工验证
})();
</script>
</body>
</html>
