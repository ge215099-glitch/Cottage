## electron-builder 配置（docs/tech-stack.md 第 10 节）
##
## 打包入口是 scripts/package-win.mjs，不是直接调 electron-builder：
## 前者会在打包前自检 better-sqlite3 的 Electron ABI，避免打出一个
## "装完启动才报找不到模块"的安装包。见该脚本头部注释。

appId: com.cottage.app
productName: Cottage
copyright: Copyright © 2026 Cottage

directories:
  buildResources: build
  output: dist

## 只收运行期真正需要的东西。
##
## 为什么显式写出来：主进程与 preload 走 electron-vite 的 externalizeDepsPlugin，
## 依赖不会被 bundle 进 out/**，而是运行期从 node_modules 里 require。
## 因此 node_modules 必须进包，而 electron-builder 在 pnpm 的符号链接布局下
## 自动收集依赖并不可靠——显式声明比赌它聪明要稳。
##
## renderer 的产物（out/renderer/index.html 及其 assets/）走相对路径引用，
## 与位置无关，不需要额外配置。
files:
  - package.json
  - out/**/*
  - '!**/*.map'
  ## 只留 better-sqlite3，其余依赖要么已被 bundle，要么是构建期工具
  - node_modules/**/*
  - '!node_modules/.pnpm/*/node_modules/{@types,electron,electron-builder,electron-vite,vite,vitest,typescript,jsdom,react-dom,@testing-library}/**'
  - '!node_modules/{electron,electron-builder,electron-vite,vite,vitest,typescript}/**'

## 原生模块必须解包到 asar 之外：.node 是动态库，asar 内的文件无法被 dlopen。
## docs/tech-stack.md 191-192 行把这条列为硬约束，验收清单第 13 条据此检查。
asarUnpack:
  - '**/*.node'
  - node_modules/better-sqlite3/**

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

## 产物名固定成 Cottage-Setup-<version>.exe：
## scripts/package-win.mjs 的 findInstaller() 与测试都按这个名字找文件。
##
## 为什么不做 portable 目标：试过。它的自解压壳在本机环境下**连解压都不发生**——
## 进程立即以退出码 0 结束、无输出、不留任何解压目录、也不建库，比应用层更早失败。
## 一个验证不了的产物不该发出去，所以只保留能打出来并检查过内容的 nsis。
artifactName: Cottage-Setup-${version}.${ext}

nsis:
  ## 一机一用户安装：不弹 UAC，普通用户也能装（同学下载后双击即可）
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Cottage
  ## 同学装完必须能卸载干净，所以保留卸载信息
  deleteAppDataOnUninstall: false
  ## 刻意不设 installerLanguages：那会走 assisted installer 的多语言分支，
  ## 实测在本仓库的 electron-builder 25.1.8 下编译出
  ## "PAGE_INSTALL_MODE … Error in macro / FUNCTION_INSTALL_MODE_PAGE_FUNCTION"。
  ## 症状很隐蔽：安装包能打出来、7z 能列出完整内容，但**静默安装不生效**
  ## （/S 返回 0 却什么都没装）。去掉它之后安装恢复可用。
  ## 语言跟随系统，安装界面与安装路径都更符合预期。
