appId: com.cottage.next
productName: Cottage Next
copyright: Copyright © 2026 Cottage

directories:
  buildResources: build
  output: dist

files:
  - package.json
  - out/**/*
  - '!**/*.map'
  - node_modules/**/*
  - '!node_modules/.pnpm/*/node_modules/{@types,electron,electron-builder,electron-vite,vite,vitest,typescript,jsdom,react-dom,@testing-library}/**'
  - '!node_modules/{electron,electron-builder,electron-vite,vite,vitest,typescript}/**'

asarUnpack:
  - '**/*.node'
  - node_modules/better-sqlite3/**

win:
  target:
    - target: nsis
      arch:
        - x64
artifactName: Cottage-Next-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Cottage Next
  deleteAppDataOnUninstall: false
